name: Release
'on':
  # push:
  #   branches:
  #     - 'main'
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout Articles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: horimislime/articles
          token: ${{ secrets.GITHUB_ACCESS_TOKEN }}
          path: posts
      - name: Checkout Images
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: horimislime/article-images
          token: ${{ secrets.GITHUB_ACCESS_TOKEN }}
          path: public/images
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - name: Build
        run: |
          npm install
          npm run prod
      - name: Deploy to Live Channel
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BLOG_70591 }}'
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
  notify:
    name: Notify
    needs:
      - build_and_deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Conclusion
        id: conclusion
        uses: technote-space/workflow-conclusion-action@45ce8e0eb155657ab8ccf346ade734257fd196a5 # renovate: tag=v3.0.3
      - name: Notify
        run: |
          curl \
          -X POST \
          -H 'Content-type: application/json' \
          --data '{"text":"Deploy ${{ steps.conclusion.outputs.conclusion }} \nhttps://horimisli.me"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
